<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연세대 치대 25학번 학습 아카이브</title>
<meta name="description" content="연세대학교 치과대학 25학번 동기들이 함께 보는 학기별 학습 아카이브">
<meta name="theme-color" content="#00205b">
<meta property="og:title" content="연세대 치대 25학번 학습 아카이브">
<meta property="og:description" content="학기별, 과목별로 정리하는 25학번 학습 자료실">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23003477'/%3E%3Cpath d='M9 8h14v3H9zM15 11h3v6h-3zM9 20h14v3H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  /* 연세 블루: 연세대학교 공식 로고 이미지에서 추출한 색 (#003477) */
  --yonsei:#003477;
  --navy:#00205b;
  --royal:#1d4f9f;
  --royal-soft:#e8eef7;
  --gray:#686767;
  --line:#cfd9e5;
  --ink:#0d1b33;
  --paper:#ffffff;
  --wash:#f5f7fa;
  --side:264px;
}
*{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);background:var(--paper);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}

/* 상단 바 */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 24px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand small{font-size:11px;letter-spacing:.14em;color:#9fb4d8;text-transform:uppercase;white-space:nowrap}
.menu-btn{display:none;border:1px solid #4a6498;padding:6px 12px;font-size:14px;color:#fff}

/* 레이아웃 */
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);padding:28px 0 48px;position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto}
.side h2{margin:0;padding:0 24px 8px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--gray)}
.side .grp{margin-bottom:28px}
.side a{display:flex;justify-content:space-between;align-items:baseline;padding:9px 24px;font-size:15px;border-left:3px solid transparent}
.side a span{font-size:12px;color:var(--gray);font-variant-numeric:tabular-nums}
.side a:hover{background:var(--wash)}
.side a.on{border-left-color:var(--yonsei);background:var(--royal-soft);color:var(--yonsei);font-weight:700}
.side a .now{font-size:11px;color:#fff;background:var(--royal);padding:0 6px;margin-left:8px;font-weight:500;letter-spacing:0}
.main{padding:40px 48px 96px;min-width:0}

/* 공통 */
.crumb{font-size:13px;color:var(--gray);margin-bottom:18px}
.crumb a:hover{color:var(--yonsei);text-decoration:underline}
.crumb i{font-style:normal;margin:0 8px;color:#a9b6c8}
h1{margin:0;font-size:34px;line-height:1.25;letter-spacing:-.03em;color:var(--navy);font-weight:800}
.lead{margin:12px 0 0;color:var(--gray);max-width:620px}
.rule{height:3px;width:56px;background:var(--yonsei);margin:22px 0 32px}
.tag{display:inline-block;border:1px solid var(--line);padding:1px 8px;font-size:12px;color:var(--gray);white-space:nowrap}
.tag.b{border-color:var(--royal);color:var(--royal)}

/* 홈: 학기 목차 */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.block h2{margin:0 0 4px;font-size:20px;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:10px}
.block h2 span{font-size:13px;font-weight:400;color:var(--gray)}
.idx a{display:grid;grid-template-columns:64px 1fr auto;align-items:baseline;gap:8px;padding:14px 4px;border-bottom:1px solid var(--line)}
.idx a:hover{background:var(--royal-soft)}
.idx .n{font-size:22px;font-weight:800;color:var(--yonsei);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.idx .t{font-size:16px}
.idx .t small{display:block;font-size:13px;color:var(--gray);margin-top:2px;line-height:1.5}
.idx .c{font-size:13px;color:var(--gray);white-space:nowrap}

/* 학기: 과목 목록 */
.list{border-top:2px solid var(--navy)}
.list{--cols:48px 1fr 110px 64px}
.list.exams{--cols:48px 1fr 110px 92px;border-top:0}
.list.exams .cr{white-space:nowrap}
.list.exams .cr.on{color:var(--royal);font-weight:700}
.list .head,.list a{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:baseline;padding:15px 8px;border-bottom:1px solid var(--line)}
.list .head{font-size:12px;color:var(--gray);letter-spacing:.06em;padding:10px 8px;background:var(--wash)}
.list a:hover{background:var(--royal-soft)}
.list .no{font-size:13px;color:var(--gray);font-variant-numeric:tabular-nums}
.list .nm{font-size:17px;font-weight:600}
.list .nm em{font-style:normal;font-weight:400;font-size:12px;color:var(--royal);margin-left:8px}
.list .cr{text-align:right;font-variant-numeric:tabular-nums;color:var(--gray)}
.note{margin-top:28px;padding-left:14px;border-left:3px solid var(--line);font-size:13px;color:var(--gray);max-width:640px}

/* 과목 */
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sec{margin-top:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:0}
.sec-h h2{margin:0;font-size:18px;color:var(--navy)}
.sec-h span{font-size:13px;color:var(--gray)}
.empty{padding:44px 0 44px 20px;border-left:3px solid var(--yonsei);margin-top:28px;background:var(--wash)}
.empty b{display:block;font-size:17px;color:var(--navy)}
.empty p{margin:6px 0 0;font-size:14px;color:var(--gray)}
.item{display:block;padding:16px 8px;border-bottom:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:56px;border-top:1px solid var(--line)}
.pager a{display:block;padding:16px 0;font-size:14px;color:var(--gray);flex:1}
.pager a b{display:block;color:var(--ink);font-size:16px;margin-top:2px}
.pager a:hover b{color:var(--yonsei)}
.pager a.r{text-align:right}

.foot{border-top:1px solid var(--line);padding:22px 24px;font-size:12px;color:var(--gray);text-align:center}

/* 시험 · 자료 목록 */
.docs{border-top:0}
.docs a{display:block;padding:20px 8px;border-bottom:1px solid var(--line)}
.docs a:hover{background:var(--royal-soft)}
.docs .t{font-size:18px;font-weight:700;color:var(--navy)}
.docs .d{font-size:14px;color:var(--gray);margin-top:2px}
.docs .m{font-size:13px;color:var(--royal);margin-top:6px}

/* ===== 기출 퀴즈 (사이트 디자인에 맞춘 스타일) ===== */
.qz{--accent:var(--yonsei);--accent-soft:var(--royal-soft);--ok:#2f7d45;--ok-bg:#e8f3ec;--bad:#b8322a;--bad-bg:#fbebe8;
 --art:#b8322a;--vein:#2a5aa6;--nerve:#9a7200;--lymph:#2f7d45;--new:#5d3b9a;--new-bg:#efe9f8;--star:#b8322a;
 --sv-muscle:#f3dcd6;--sv-muscle-l:#d9a79b;--sv-bone:#f4efe2;--sv-band:#e6d3cc;--muted:var(--gray);--rule:var(--line);--chip:#e8edf3;--plate:#e8eef7;
 font-size:15px;overflow-wrap:anywhere}
.qz-legend{display:flex;gap:16px;font-size:12px;color:var(--gray);flex-wrap:wrap;margin:-8px 0 18px}
.qz-legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:0}
.qz .tabs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--navy);margin-bottom:14px}
.qz .tab{appearance:none;border:0;border-right:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:14px;padding:9px 4px;cursor:pointer;min-height:48px;line-height:1.25}
.qz .tab:last-child{border-right:0}
.qz .tab small{display:block;font-weight:400;font-size:11px;color:var(--gray)}
.qz .tab[aria-selected="true"]{background:var(--navy);color:#fff}
.qz .tab[aria-selected="true"] small{color:#b9c8e3}
.qz .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.qz .chip{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;min-height:36px}
.qz .chip:hover{border-color:var(--royal)}
.qz .chip[aria-pressed="true"]{background:var(--yonsei);border-color:var(--yonsei);color:#fff;font-weight:700}
.qz .sep{width:1px;background:var(--line);margin:4px 4px}
.qz .card{border-top:2px solid var(--navy);padding:18px 0 8px;margin-top:14px}
.qz .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin-bottom:10px}
.qz .prog{flex:1 1 120px;height:3px;background:var(--chip);min-width:80px}
.qz .prog b{display:block;height:100%;background:var(--yonsei)}
.qz .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border:1px solid var(--line);color:var(--gray);white-space:nowrap}
.qz .badge.p{border-color:var(--royal);color:var(--royal)}
.qz .badge.n{border-color:var(--new);color:var(--new)}
.qz .badge.t1{background:var(--navy);border-color:var(--navy);color:#fff}
.qz .stars{color:var(--star);letter-spacing:-1px;font-size:12px}
.qz .q{font-size:18px;font-weight:700;line-height:1.5;margin:4px 0 14px;color:var(--ink)}
.qz .opts{display:grid;gap:6px}
.qz .opt{appearance:none;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:15px;padding:11px 12px;cursor:pointer;min-height:48px}
.qz .opt:hover:not(:disabled){background:var(--wash)}
.qz .opt .k{flex:none;width:24px;height:24px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--gray);margin-top:1px}
.qz .opt[aria-pressed="true"]{border-color:var(--yonsei);background:var(--royal-soft)}
.qz .opt[aria-pressed="true"] .k{background:var(--yonsei);border-color:var(--yonsei);color:#fff}
.qz .opt.right{border-color:var(--ok);background:var(--ok-bg)}
.qz .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.qz .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.qz .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.qz .opt:disabled{cursor:default}
.qz .hint{font-size:12.5px;color:var(--gray);margin:-6px 0 12px}
.qz .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.qz .btn{appearance:none;border:1px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:14px;padding:10px 16px;cursor:pointer;min-height:44px}
.qz .btn:hover:not(:disabled){background:var(--royal-soft)}
.qz .btn.pri{background:var(--yonsei);border-color:var(--yonsei);color:#fff}
.qz .btn.pri:hover:not(:disabled){background:var(--navy)}
.qz .btn.ok{border-color:var(--ok);color:var(--ok)}
.qz .btn.bad{border-color:var(--bad);color:var(--bad)}
.qz .btn:disabled{opacity:.4;cursor:default}
.qz .spacer{flex:1}
.qz .fb{margin-top:14px;padding:12px 14px;font-size:14.5px;border-left:4px solid var(--line);background:var(--wash)}
.qz .fb.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.qz .fb.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.qz .fb .h{font-weight:700;margin-bottom:2px}
.qz .fb.ok .h{color:var(--ok)}.qz .fb.bad .h{color:var(--bad)}
.qz .ansline{font-size:16px;font-weight:700}
.qz input.ans,.qz textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--navy);padding:12px 14px}
.qz textarea{min-height:160px;resize:vertical;line-height:1.6;font-size:15px}
.qz select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--navy);padding:8px 10px;min-height:44px;max-width:100%}
.qz .score{font-size:13px;color:var(--gray)}
.qz .score b{color:var(--ink)}
.qz .prompt{font-weight:700;font-size:18px;line-height:1.5;border-left:4px solid var(--yonsei);padding:2px 0 2px 12px;margin:6px 0 14px;color:var(--navy)}
.qz .ans-body{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;font-size:14.5px}
.qz .ans-body p{margin:6px 0 10px}
.qz .tbl{overflow-x:auto;margin:8px 0 12px;border:1px solid var(--line)}
.qz .ans-body table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px;line-height:1.5}
.qz .ans-body th,.qz .ans-body td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.qz .ans-body tr:last-child td{border-bottom:0}
.qz .ans-body th{background:var(--plate);font-weight:700;color:var(--navy)}
.qz .ans-body td.k{font-weight:700;background:var(--wash);white-space:nowrap}
.qz .ans-body .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 12px}
.qz .ans-body .kv dt{font-weight:700;color:var(--yonsei);white-space:nowrap}
.qz .ans-body .kv dd{margin:0}
.qz .ans-body .small{font-size:13px}
.qz .ans-body .muted{color:var(--gray)}
.qz .a{color:var(--art);font-weight:700}.qz .v{color:var(--vein);font-weight:700}.qz .n{color:var(--nerve);font-weight:700}.qz .l{color:var(--lymph);font-weight:700}
.qz .fig{margin:12px 0;background:var(--wash);padding:10px;overflow-x:auto}
.qz .fig svg{min-width:0;width:100%}
.qz h3.sec{font-size:13px;letter-spacing:.08em;color:var(--yonsei);margin:18px 0 8px;font-weight:700}
.qz ol.draw{margin:0;padding-left:20px;font-size:14px}
.qz ol.draw li{margin:3px 0}
.qz .keys{display:grid;gap:6px}
.qz .keys label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);cursor:pointer;font-size:14px;background:#fff}
.qz .keys input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--yonsei);flex:none}
.qz .keys label.on{border-color:var(--yonsei);background:var(--royal-soft)}
.qz .kscore{font-weight:700;font-size:15px}
.qz .wlist{display:grid;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.qz .witem{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 4px}
.qz .witem .tx{flex:1;min-width:0;font-size:14px}
.qz .witem .tx b{display:block;color:var(--ok);font-size:13.5px;margin-top:2px}
.qz .x{appearance:none;border:0;background:transparent;color:var(--gray);font-size:18px;cursor:pointer;width:36px;height:36px;flex:none}
.qz .x:hover{background:var(--royal-soft)}
.qz .empty{border:0;background:none;margin:0;color:var(--gray);text-align:center;padding:28px 8px}
.qz .sum{text-align:center;padding:10px 0 4px}
.qz .sum .big{font-size:48px;font-weight:800;line-height:1.1;color:var(--navy)}
.qz .sum .big small{font-size:20px;color:var(--gray)}
.qz .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--royal);font-weight:700}
.qz-foot{margin-top:28px;padding-left:14px;border-left:3px solid var(--line);font-size:12.5px;color:var(--gray);line-height:1.6}
.qz-foot kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;padding:0 4px}
.qz .tabs{scroll-margin-top:72px}
.qz .badge.ok{border-color:var(--ok);color:var(--ok)}
.qz .badge.rv{border-color:var(--bad);color:var(--bad)}
.qz .fc{border:1px solid var(--navy);border-top:4px solid var(--navy);background:#fff;padding:18px 20px 20px;margin-top:4px}
.qz .fc-side{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--royal);margin-bottom:10px}
.qz .fc .q{font-size:20px;margin-top:0}
.qz .fc-box{margin-top:20px;border:1px solid var(--line);padding:12px 16px 16px;min-height:92px}
.qz .fc-box.closed{background:var(--wash);cursor:pointer}
.qz .fc-box.closed:hover{border-color:var(--royal);background:var(--royal-soft)}
.qz .fc-box.open{background:var(--royal-soft);border-color:var(--yonsei);border-left:4px solid var(--yonsei)}
.qz .fc-ans{font-size:22px;font-weight:800;color:var(--navy);line-height:1.4}
.qz .fc-opts{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.qz .fc-opts li{display:flex;gap:10px;align-items:flex-start}
.qz .fc-opts b{flex:none;width:22px;height:22px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px;color:var(--gray);margin-top:1px}
.qz .fc-tap{font-size:13px;color:var(--gray)}
.qz .fc-keys{margin:0 0 12px;padding-left:20px;font-size:14.5px}
.qz .fc-keys li{margin:3px 0}
.qz .fc-box .ans-body{border-top-color:#b9c8e3}
.qz .fc-box .tbl{background:#fff}
.qz .fc-box.fo{animation:fcOut .14s ease-in forwards}
.qz .fc-box.fi{animation:fcIn .16s ease-out}
@keyframes fcOut{to{transform:perspective(900px) rotateY(88deg)}}
@keyframes fcIn{from{transform:perspective(900px) rotateY(-88deg)}to{transform:perspective(900px) rotateY(0)}}
.qz .sv{max-width:100%;height:auto;display:block;margin:0 auto}
.qz .sv text{font-size:12px;fill:var(--ink)}
.qz .sv .sm{font-size:10.5px;fill:var(--gray)}
.qz .sv .b{font-weight:700}
.qz .sv .ln{stroke:var(--ink);fill:none;stroke-width:1.4}
.qz .sv .thin{stroke:var(--gray);fill:none;stroke-width:1}
.qz .sv .dash{stroke-dasharray:4 3}
.qz .sv .ar{stroke:var(--art);fill:none;stroke-width:2.2;stroke-linecap:round}
.qz .sv .ar.t{stroke-width:3.6}
.qz .sv .ve{stroke:var(--vein);fill:none;stroke-width:2.6;stroke-linecap:round}
.qz .sv .ne{stroke:var(--nerve);fill:none;stroke-width:2.6;stroke-linecap:round}
.qz .sv .fa{fill:var(--art)}.qz .sv .fv{fill:var(--vein)}.qz .sv .fn{fill:var(--nerve)}.qz .sv .fl{fill:var(--lymph)}
.qz .sv .ta{fill:var(--art)}.qz .sv .tv{fill:var(--vein)}.qz .sv .tn{fill:var(--nerve)}.qz .sv .tl{fill:var(--lymph)}
.qz .sv .mu{fill:var(--sv-muscle);stroke:var(--sv-muscle-l);stroke-width:1}
.qz .sv .bone{fill:var(--sv-bone);stroke:var(--ink);stroke-width:1.2}
.qz .sv .band{fill:var(--sv-band);stroke:none}
@media (max-width:520px){.qz .q,.qz .prompt{font-size:16.5px}.qz .tab{font-size:13px}}


/* ===== 기출 덱 (학습카드·퀴즈·오답노트·진행도) — 사이트 디자인 ===== */
.dk{--paper:#fff;--muted:var(--gray);--good:#2f7d45;--bad:#b8322a;--flag:#8a5a00;--pelvis:#1d4f9f;--peri:#5d3b9a;--leg:#9a5b00;font-size:15px;overflow-wrap:anywhere}

.dk button,.dk select,.dk input{font:inherit;color:inherit}
.dk .stats{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.dk .stat{border:1px solid var(--line);padding:3px 10px;font-size:12px;color:var(--muted)}
.dk .stat b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.dk .tabs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--navy);background:#fff;position:sticky;top:56px;z-index:5;scroll-margin-top:56px;margin-bottom:14px}
.dk .tabs button{appearance:none;border:0;border-right:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:11px 4px;cursor:pointer;min-height:46px}
.dk .tabs button:last-child{border-right:0}
.dk .tabs button[aria-current="page"]{background:var(--navy);color:#fff}
.dk .tabs .n{font-size:11px;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
.dk .filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dk .filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:700}
.dk .filters select{appearance:none;-webkit-appearance:none;background:#fff;border:1px solid var(--navy);padding:8px 8px;font-size:13.5px;color:var(--ink);width:100%;min-height:40px}
.dk .fnote{font-size:12.5px;color:var(--muted)}
.dk .fbox{background:#fff;border:1px solid var(--line)}
.dk .fbox>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.dk .fbox>summary::-webkit-details-marker{display:none}
.dk .fbox>summary .what{font-weight:700;color:var(--navy)}
.dk .fbox>summary .act{color:var(--royal);font-size:12.5px;white-space:nowrap}
.dk .fbox[open]>summary{border-bottom:1px solid var(--line)}
.dk .fbox .fin{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.dk .card{background:#fff;border:1px solid var(--line);border-top:0}
.dk .card[data-r="pelvis"]{--rc:var(--pelvis)}
.dk .card[data-r="peri"]{--rc:var(--peri)}
.dk .card[data-r="leg"]{--rc:var(--leg)}
.dk .card .band{height:4px;background:var(--rc)}
.dk .cardbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.dk .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.dk .chip{display:inline-flex;align-items:center;padding:1px 8px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap;font-size:11.5px}
.dk .chip.reg{background:var(--rc);border-color:var(--rc);color:#fff}
.dk .chip.src{font-weight:500;font-variant-numeric:tabular-nums}
.dk .chip.pred{color:var(--flag);border-color:var(--flag)}
.dk .sub{color:var(--muted);font-size:12px}
.dk .stars{color:var(--rc);letter-spacing:1px;font-size:12px;margin-left:auto}
.dk .q{margin:0;font-size:19px;font-weight:700;line-height:1.5;letter-spacing:-.01em;color:var(--ink)}
.dk .opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.dk .opts .no{color:var(--muted);font-size:13px;min-width:1.3em}

.dk .btn.good{background:var(--good);border-color:var(--good);color:#fff}

.dk .btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.dk .btn.bad:hover:not(:disabled){background:#9a2820}

.dk .btn.grow{flex:1 1 0}
.dk .btn:disabled{opacity:.4;cursor:default}
.dk :focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.dk .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dk .lastres{font-size:12px;color:var(--muted)}
.dk .lastres .ok{color:var(--good);font-weight:700}
.dk .lastres .no{color:var(--bad);font-weight:700}

.dk .choice{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);background:#fff;padding:11px 12px;font-size:16px;cursor:pointer;color:var(--ink)}

.dk .choice.wrong{border-color:var(--bad);background:#fbebe8}
.dk .choice:disabled{cursor:default;color:var(--ink)}
.dk .choice.miss{border-color:var(--good);border-style:dashed}
.dk .choice.multi[aria-pressed="true"]{border-color:var(--yonsei);background:var(--royal-soft)}
.dk .choice .box{font-size:18px;line-height:1;color:var(--muted)}
.dk .choice.multi[aria-pressed="true"] .box{color:var(--yonsei)}
.dk .hint{font-size:13px;color:var(--muted)}
.dk .exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}

.dk .exlist li.okk{border-left-color:var(--good)}
.dk .exlist li.nok{border-left-color:var(--bad)}
.dk .exlist .tag{font-weight:700;font-size:12.5px;margin-right:4px;border:0;padding:0}
.dk .exlist li.okk .tag{color:var(--good)}
.dk .exlist li.nok .tag{color:var(--bad)}
.dk .typed{width:100%;border:1px solid var(--navy);background:#fff;padding:12px 14px;font-size:16px}
.dk .verdict{font-weight:800;font-size:17px}
.dk .verdict.ok{color:var(--good)}
.dk .verdict.no{color:var(--bad)}
.dk .match{font-size:13px;color:var(--good);font-weight:700}
.dk .panel{background:#fff;border:1px solid var(--line);border-top:2px solid var(--navy);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.dk .panel h2{margin:0;font-size:17px;letter-spacing:-.01em;color:var(--navy)}
.dk .panel p{margin:0;color:var(--muted);font-size:14px}

.dk .seg button:hover{border-color:var(--royal)}
.dk .seg button[aria-pressed="true"]{background:var(--yonsei);color:#fff;border-color:var(--yonsei)}
.dk .toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.dk .toggle input{width:18px;height:18px;accent-color:var(--yonsei)}
.dk .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--navy)}

.dk .item .cardbody{gap:9px;padding:13px 16px 14px}
.dk .item .q{font-size:16.5px}

.dk .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dk .tile{background:#fff;border:1px solid var(--line);border-top:2px solid var(--navy);padding:12px}
.dk .tile .k{font-size:12px;color:var(--muted);font-weight:700}

.dk .reghead{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.dk .reghead span:last-child{font-size:12.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}

.dk .stack .g{background:var(--good)}
.dk .stack .b{background:var(--bad)}

.dk .legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:0}
.dk table.subs{width:100%;border-collapse:collapse;font-size:13.5px}
.dk table.subs th,.dk table.subs td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.dk table.subs th{font-size:12px;color:var(--navy);font-weight:700;background:var(--wash)}
.dk table.subs td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dk table.subs th.n{text-align:right}
.dk .tablewrap{overflow-x:auto}
.dk .warnbar{background:#fbf3df;border-left:4px solid var(--flag);padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.dk .kbd{font-size:11.5px;color:var(--muted)}

@media (max-width:560px){.dk .filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.dk .q{font-size:17.5px}.dk .tiles .v{font-size:21px}.dk .kbd{display:none}.dk .cardbody{padding:14px 14px 16px}.dk .panel{padding:14px}}
@media (prefers-reduced-motion:no-preference){.dk .ans,.dk .result{animation:dkrise .18s ease-out}@keyframes dkrise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}

/* 모바일 */
@media (max-width:860px){
  .top-in{padding:0 16px}
  .brand small{display:none}
  .menu-btn{display:block}
  .wrap{display:block}
  .side{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;max-height:none;background:#fff;z-index:15;border:0;padding-top:16px}
  body.open .side{display:block}
  body.open{overflow:hidden}
  .main{padding:28px 18px 72px}
  h1{font-size:27px}
  .home-grid{grid-template-columns:1fr;gap:36px}
  .list .head{display:none}
  .list a{grid-template-columns:1fr auto;grid-template-areas:"nm cr" "no cr";gap:2px 12px;padding:14px 4px}
  .list .nm{grid-area:nm}.list .no{grid-area:no}.list .cr{grid-area:cr;align-self:center}
  .list .gb{display:none}
  .idx a{grid-template-columns:52px 1fr auto}
}

let renderTok = 0;
function render() {
  const q = new URLSearchParams(location.search);
  const t = termById(q.get("s"));
  const cname = q.get("c");
  const x = t && cname ? t.courses.find(k => k.name === cname) : null;
  const exam = x && q.get("e") ? examsOf(x).find(z => z.key === q.get("e")) : null;
  const ct = exam && q.get("k") ? (exam.contents || []).find(z => z.key === q.get("k")) : null;
  const tok = ++renderTok; activeQuiz = null;
  let html, title = "연세대 치대 25학번 학습 아카이브";
  const tail = " · 25학번 학습 아카이브";
  if (t && x && exam && ct) { html = viewQuiz(t, x, exam, ct); title = x.name + " " + exam.key + "차 " + ct.title + tail; }
  else if (t && x && exam) { html = viewExam(t, x, exam); title = x.name + " " + exam.title + tail; }
  else if (t && x) { html = viewCourse(t, x); title = x.name + " · " + t.label + " · 25학번 학습 아카이브"; }
  else if (t) { html = viewTerm(t); title = t.full + " · 25학번 학습 아카이브"; }
  else html = viewHome();
  renderSide(t ? t.id : null);
  $("#main").innerHTML = html;
  document.title = title;
  document.body.classList.remove("open");
  $("#menuBtn").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
  if (t && x && exam && ct && ct.src) {
    fetch(ct.src).then(r => { if (!r.ok) throw 0; return r.json(); }).then(D => {
      if (tok !== renderTok) return;
      activeQuiz = ({ deck: mountDeck }[ct.type])($("#qz"), D, ct.storeKey);
    }).catch(() => {
      if (tok === renderTok) $("#qz").innerHTML = '<div class="empty">퀴즈를 불러오지 못했어요. 새로고침 해 보세요.</div>';
    });
  }
}

let activeQuiz = null;
/* ===================================================================
   기출 덱 엔진 (학습카드 · 퀴즈 · 오답노트 · 진행도)
   mountDeck(화면 요소, 문제 배열, 저장키) — 문제 배열의 각 항목:
   { id, r:부위, s:단원, t:'short'|'mcq'|'multi', q, a, o?, e?, ex?, y, k:중요도, src }
   =================================================================== */
function mountDeck(root, DATA, KEY) {
  root.innerHTML = '<div class="stats" id="stats"></div><div id="warn"></div>' +
    '<nav class="tabs" id="tabs" aria-label="화면"><button data-v="cards">학습카드</button><button data-v="quiz">퀴즈</button><button data-v="notes">오답노트</button><button data-v="progress">진행도</button></nav><div id="view"></div>';
const BY = Object.fromEntries(DATA.map(d => [d.id, d]));
const RK = { '골반': 'pelvis', '샅': 'peri', '다리': 'leg' };
const TL = { short: '단답형', mcq: '객관식 · 답 1개', multi: '객관식 · 답 여러 개' };
const DEF = {
  res: {}, notes: {}, quiz: null, auto: true, view: 'cards',
  f: { r: 'all', t: 'all', src: 'all', k: '0', st: 'all' },
  cards: { sig: '', order: [], pos: 0, shuffle: false },
  qset: { n: '20', shuffle: true }
};
let S = JSON.parse(JSON.stringify(DEF));
let canSave = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const got = JSON.parse(raw);
    S = Object.assign(S, got);
    S.f = Object.assign({}, DEF.f, got.f || {});
    S.cards = Object.assign({}, DEF.cards, got.cards || {});
    S.qset = Object.assign({}, DEF.qset, got.qset || {});
  }
} catch (e) { canSave = false; }
function save() {
  if (!canSave) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { canSave = false; showWarn(); }
}
function showWarn() {
  root.querySelector('#warn').innerHTML = canSave ? '' :
    '<div class="warnbar">이 브라우저에서는 저장이 막혀 있어요. 새로고침하면 진행도와 오답노트가 사라져요. 시크릿 모드가 아닌 창에서 열어 주세요.</div>';
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const NUM = ['①', '②', '③', '④', '⑤', '⑥'];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function stars(k) { return '★'.repeat(k) + '☆'.repeat(3 - k); }
function dispNo(i, perm) { return NUM[perm ? perm.indexOf(i) : i]; }
function srcChip(d) { return d.src === '예상' ? '<span class="chip pred">예상문제</span>' : `<span class="chip src">기출 ${esc(d.y)}</span>`; }
function norm(s) { return String(s).toLowerCase().replace(/\([^)]*\)/g, '').replace(/[\s·,\/\-→=()\[\]'"‘’“”.~+]/g, ''); }
function filtered(f) {
  f = f || S.f;
  return DATA.filter(d => {
    if (f.r !== 'all' && d.r !== f.r) return false;
    if (f.t !== 'all' && d.t !== f.t) return false;
    if (f.src !== 'all' && d.src !== f.src) return false;
    if (d.k < +f.k) return false;
    const r = S.res[d.id];
    if (f.st === 'new' && r) return false;
    if (f.st === 'wrong' && !(r && r.l === 0)) return false;
    if (f.st === 'note' && !S.notes[d.id]) return false;
    return true;
  }).map(d => d.id);
}
function record(id, ok) {
  const r = S.res[id] || { n: 0, c: 0 };
  r.n++; if (ok) r.c++; r.l = ok ? 1 : 0; r.t = Date.now();
  S.res[id] = r;
  if (!ok && S.auto && !S.notes[id]) S.notes[id] = Date.now();
}

let fOpen = false;

function bindQuestion() {

      </div></div>

}
function renderQuiz() {
  const v = root.querySelector('#view');

    document.getElementById('allnote').onclick = () => { wrong.forEach(id => { if (!S.notes[id]) S.notes[id] = Date.now(); }); save(); renderAll(); };

        `<button data-reg="${k}" aria-pressed="${noteReg === k}">${t}</button>`).join('')}</div>
      <div class="row">
        <button class="btn primary grow" id="nquiz" ${ids.length ? '' : 'disabled'}>이 ${ids.length}문제로 퀴즈</button>
        <button class="btn grow" id="ncards" ${ids.length ? '' : 'disabled'}>카드로 보기</button>
        <button class="btn grow" id="nall">${noteAll ? '답 모두 가리기' : '답 모두 보기'}</button>
      </div></div>
    ${ids.length ? `<div class="list" style="margin-top:12px">${ids.map(id => noteItem(BY[id], false)).join('')}</div>`
      : '<div class="empty" style="margin-top:12px">아직 비어 있어요. 학습카드나 퀴즈에서 ☆ 오답노트에 넣기를 누르면 여기에 모입니다.</div>'}`;
  document.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => { noteReg = b.dataset.reg; renderNotes(); });
  document.getElementById('nquiz').onclick = () => { startQuiz(ids, true); setView('quiz'); };
  document.getElementById('ncards').onclick = () => { S.f = Object.assign({}, DEF.f, { st: 'note', r: noteReg }); revealed = false; save(); setView('cards'); };
  document.getElementById('nall').onclick = () => { noteAll = !noteAll; renderNotes(); };
  bindNoteItems(renderNotes);
}

/* ---------- progress ---------- */
let confirmKey = '';
function renderProgress() {
  const v = root.querySelector('#view');
  const done = DATA.filter(d => S.res[d.id]);
  const ok = done.filter(d => S.res[d.id].l === 1).length;
  const nn = Object.keys(S.notes).filter(id => BY[id]).length;
  const regs = ['골반', '샅', '다리'].map(r => {
    const all = DATA.filter(d => d.r === r);
    const g = all.filter(d => S.res[d.id] && S.res[d.id].l === 1).length;
    const b = all.filter(d => S.res[d.id] && S.res[d.id].l === 0).length;
    return `<div class="regrow"><div class="reghead"><span>${r}</span><span>맞음 ${g} · 틀림 ${b} · 안 푼 ${all.length - g - b} / ${all.length}</span></div>
      <div class="stack"><i class="g" style="width:${g / all.length * 100}%"></i><i class="b" style="width:${b / all.length * 100}%"></i></div></div>`;
  }).join('');
  const subs = [];
  DATA.forEach(d => { const key = d.r + '|' + d.s; let s = subs.find(x => x.key === key); if (!s) { s = { key, r: d.r, s: d.s, n: 0, done: 0, ok: 0 }; subs.push(s); } s.n++; if (S.res[d.id]) { s.done++; if (S.res[d.id].l === 1) s.ok++; } });
  v.innerHTML = `<div class="tiles">
      <div class="tile"><div class="k">푼 문제</div><div class="v">${done.length}<small>/${DATA.length}</small></div></div>
      <div class="tile"><div class="k">최근 정답률</div><div class="v">${done.length ? Math.round(ok / done.length * 100) : 0}<small>%</small></div></div>
      <div class="tile"><div class="k">오답노트</div><div class="v">${nn}</div></div></div>
    <div class="panel" style="margin-top:12px"><h2>부위별</h2>${regs}
      <div class="legend"><span><i style="background:var(--good)"></i>최근 맞음</span><span><i style="background:var(--bad)"></i>최근 틀림</span><span><i style="background:var(--line)"></i>안 푼 문제</span></div></div>
    <div class="panel" style="margin-top:12px"><h2>단원별</h2><div class="tablewrap"><table class="subs">
      <thead><tr><th>부위</th><th>단원</th><th class="n">문제</th><th class="n">푼 문제</th><th class="n">정답률</th></tr></thead>
      <tbody>${subs.map(s => `<tr><td>${s.r}</td><td>${esc(s.s)}</td><td class="n">${s.n}</td><td class="n">${s.done}</td><td class="n">${s.done ? Math.round(s.ok / s.done * 100) + '%' : '–'}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel" style="margin-top:12px"><h2>초기화</h2><p>이 브라우저에만 저장돼 있어요. 다른 기기와는 이어지지 않습니다.</p>
      <div class="row">
        <button class="btn ${confirmKey === 'res' ? 'bad' : ''}" id="rres">${confirmKey === 'res' ? '정말 진행도를 지울까요? 한 번 더 누르기' : '진행도 초기화'}</button>
        <button class="btn ${confirmKey === 'notes' ? 'bad' : ''}" id="rnotes">${confirmKey === 'notes' ? '정말 비울까요? 한 번 더 누르기' : '오답노트 비우기'}</button>
      </div></div>`;
  document.getElementById('rres').onclick = () => { if (confirmKey === 'res') { S.res = {}; S.quiz = null; confirmKey = ''; save(); renderAll(); } else { confirmKey = 'res'; renderProgress(); } };
  document.getElementById('rnotes').onclick = () => { if (confirmKey === 'notes') { S.notes = {}; confirmKey = ''; save(); renderAll(); } else { confirmKey = 'notes'; renderProgress(); } };
}

/* ---------- router ---------- */
const VIEWS = { cards: renderCards, quiz: renderQuiz, notes: renderNotes, progress: renderProgress };
function route() { return VIEWS[S.view] ? S.view : 'cards'; }
function renderAll() {
  const r = route();
  root.querySelectorAll('.tabs button').forEach(a => a.setAttribute('aria-current', a.dataset.v === r ? 'page' : 'false'));
  if (r !== 'progress') confirmKey = '';
  renderStats(); showWarn(); VIEWS[r]();
}
function setView(v) {
  if (!VIEWS[v]) return;
  S.view = v; save(); revealed = false; renderAll();
  const t = root.querySelector('#tabs'); if (t) t.scrollIntoView({ block: 'start' });
}
function onClick(e) {
  const b = e.target.closest('.tabs button[data-v]');
  if (b && root.contains(b)) { if (b.dataset.v !== route()) setView(b.dataset.v); }
}
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target !== document.body && e.target !== document.documentElement && !root.contains(e.target)) return;
  if (e.target.matches && e.target.matches('input, select, textarea')) return;
  const r = route();
  if (r === 'cards') {
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); const b = document.getElementById('rev'); if (b) b.click(); }
    if (e.key === 'ArrowRight') { const b = document.getElementById('next'); if (b && !b.disabled) b.click(); }
    if (e.key === 'ArrowLeft') { const b = document.getElementById('prev'); if (b && !b.disabled) b.click(); }
  } else if (r === 'quiz' && S.quiz && S.quiz.view) {
    if (/^[1-4]$/.test(e.key)) { const bs = document.querySelectorAll('.choice[data-pick]:not(:disabled)'); const b = bs[+e.key - 1]; if (b) b.click(); }
    if (e.key === 'Enter') { const g = document.getElementById('gradeMulti'); const b = g && !g.disabled ? g : document.getElementById('nextq'); if (b) { e.preventDefault(); b.click(); } }
  }
}
renderAll();
return { onClick, onChange() {}, onInput() {}, onKey };
}

document.addEventListener("click", e => { if (activeQuiz) activeQuiz.onClick(e); });
document.addEventListener("change", e => { if (activeQuiz) activeQuiz.onChange(e); });
document.addEventListener("input", e => { if (activeQuiz) activeQuiz.onInput(e); });
document.addEventListener("keydown", e => { if (activeQuiz) activeQuiz.onKey(e); });

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-go]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault();
  history.pushState(null, "", a.getAttribute("href"));
  render();
});
window.addEventListener("popstate", render);
$("#menuBtn").addEventListener("click", () => {
  const open = document.body.classList.toggle("open");
  $("#menuBtn").setAttribute("aria-expanded", open);
});
render();
</script>
</body>
</html>
